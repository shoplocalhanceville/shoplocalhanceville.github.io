name: Lighthouse CI Gate

# Charles Development Standard gate: every pull request must pass the
# Lighthouse CI assertions in .lighthouserc.json (desktop) and
# .lighthouserc.mobile.json (mobile) before it can merge.
# A failed gate blocks the merge. Only Charles may waive a failed gate,
# in writing, for that one release.

on:
  pull_request:
  workflow_dispatch:

# One gate run per pull request at a time: a new push cancels the run for
# the superseded head instead of letting it run to a failure result.
# Only the newest head's run completes and reports, which is the only run
# that judges the pull request (standing gate rule). Assertions and
# configs are unchanged.
concurrency:
  group: lighthouse-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: "Install Lighthouse CI (pinned: lhci 0.15.1, Lighthouse 12.6.1)"
        run: npm install -g @lhci/cli@0.15.1
      - name: Run Lighthouse CI (desktop)
        run: lhci autorun --config=.lighthouserc.json
      - name: Run Lighthouse CI (mobile)
        if: always()
        run: lhci autorun --config=.lighthouserc.mobile.json
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci-reports
